<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ATM10 Quest Planner</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<header>

    <div>

        <div class="eyebrow">
            ALL THE MODS 10
        </div>

        <h1>
            Quest Planner
        </h1>

        <p>
            Plan your progression and track what you need next.
        </p>

    </div>


    <div class="progress-box">

        <span>
            Overall Progress
        </span>

        <strong id="progressText">
            0%
        </strong>

        <div class="progress">

            <div id="progressBar"></div>

        </div>

    </div>

</header>


<main>

    <div class="toolbar">

        <input
            id="search"
            type="search"
            placeholder="Search quests or resources..."
        >

        <button id="expandAll">
            Expand All
        </button>

        <button id="collapseAll">
            Collapse All
        </button>

        <button id="reset">
            Reset Progress
        </button>

    </div>


    <section id="columns"></section>

</main>


<footer>

    ATM10 Quest Planner

</footer>


<script src="script.js"></script>

</body>

</html>
