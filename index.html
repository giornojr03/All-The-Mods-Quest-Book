<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ATM10 Quest Planner</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<header>
   

    <div>

      <img
    src="Screenshot 2026-09-16 092709.png"
    alt="All The Mods 10"
    class="atm10-logo"
>

    </div>

     <nav class="top-nav">
         <button class="home-button">
    <img
    src="blue-house.png"
    alt=""
    class="home-icon"
>
    Home
</button>
          
        <button onclick="document.getElementById('columns').scrollIntoView()">
            Questbook
        </button>    
        <button>Progress</button>
        <button>Settings</button>
    </nav>


   

</header>
   

<main>

    <div class="toolbar">

        <input
            id="search"
            type="search"
            placeholder="Search quests or resources..."
        >

        <button id="expandAll">
            Expand All
        </button>

        <button id="collapseAll">
            Collapse All
        </button>

        <button id="reset">
            Reset Progress
        </button>

    </div>


    <section id="columns"></section>

</main>


<footer>

      <div class="progress-box">

        <span>
            Overall Progress
        </span>

        <strong id="progressText">
            0%
        </strong>

        <div class="progress">

            <div id="progressBar"></div>

        </div>

    </div>


</footer>


<script src="script.js"></script>

</body>

</html>
